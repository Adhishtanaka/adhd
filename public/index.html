<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>adhd</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://esm.sh/@xyflow/react@12.3.5/dist/style.css" />
    <!-- Flows page only. esm.sh serves a module graph, which can't carry SRI, so
         versions are pinned exactly; vendor these into public/ if offline use or
         CDN trust ever matters. ?external=react,react-dom is load-bearing: without
         it esm.sh inlines its own React and React Flow's hooks run against a second
         copy ("invalid hook call"). This ESM React is still separate from the UMD
         React app.js uses — different roots, they never share state. -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
          "react-dom": "https://esm.sh/react-dom@18.3.1",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
          "@xyflow/react": "https://esm.sh/@xyflow/react@12.3.5?external=react,react-dom"
        }
      }
    </script>
    <script>
      // Apply saved theme before first paint (no flash of wrong theme).
      // "system" (default) leaves data-theme unset so the media query decides.
      (function () {
        var t = localStorage.getItem("theme") || "system";
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              base: "rgb(var(--c-bg) / <alpha-value>)",
              surface: "rgb(var(--c-surface) / <alpha-value>)",
              raise: "rgb(var(--c-surface-2) / <alpha-value>)",
              line: "rgb(var(--c-border) / <alpha-value>)",
              paper: "rgb(var(--c-text) / <alpha-value>)",
              dim: "rgb(var(--c-text-dim) / <alpha-value>)",
              signal: "rgb(var(--c-accent) / <alpha-value>)",
              gold: "rgb(var(--c-accent-2) / <alpha-value>)",
              done: "rgb(var(--c-positive) / <alpha-value>)",
              bad: "rgb(var(--c-negative) / <alpha-value>)",
              iris: "rgb(var(--c-info) / <alpha-value>)",
            },
            fontFamily: {
              display: ["Space Grotesk", "ui-sans-serif", "system-ui"],
              sans: ["Inter", "ui-sans-serif", "system-ui"],
              mono: ["ui-monospace", "SFMono-Regular", "Menlo", "monospace"],
            },
          },
        },
      };
    </script>
    <!-- Exact versions + SRI: the spec renderer runs model-supplied content, so a
         swapped CDN payload would be running in this origin. -->
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"
            integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z"
            crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"
            integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1"
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
      /* ---- design tokens: near-grayscale, ChatGPT-style. Blue is the only accent. ---- */
      :root, :root[data-theme="dark"] {
        --c-bg: 33 33 33; --c-surface: 47 47 47; --c-surface-2: 23 23 23; --c-border: 61 61 61;
        --c-text: 236 236 236; --c-text-dim: 142 142 142;
        --c-accent: 96 165 250; --c-accent-2: 163 163 163;
        --c-positive: 52 211 153; --c-negative: 248 113 113; --c-info: 167 139 250;
      }
      /* light palette — applied for explicit light choice, or for system default (no data-theme) when the OS prefers light */
      :root[data-theme="light"] {
        --c-bg: 255 255 255; --c-surface: 247 247 247; --c-surface-2: 249 249 249; --c-border: 229 229 229;
        --c-text: 13 13 13; --c-text-dim: 141 141 141;
        --c-accent: 37 99 235; --c-accent-2: 115 115 115;
        --c-positive: 22 163 74; --c-negative: 220 38 38; --c-info: 124 58 237;
      }
      @media (prefers-color-scheme: light) {
        :root:not([data-theme="dark"]):not([data-theme="light"]) {
          --c-bg: 255 255 255; --c-surface: 247 247 247; --c-surface-2: 249 249 249; --c-border: 229 229 229;
          --c-text: 13 13 13; --c-text-dim: 141 141 141;
          --c-accent: 37 99 235; --c-accent-2: 115 115 115;
          --c-positive: 22 163 74; --c-negative: 220 38 38; --c-info: 124 58 237;
        }
      }
      /* ---- context strip ---- */
      /* One colour per message kind, reusing the palette so the strip reads as
         part of the app in both themes rather than a foreign chart. */
      #ctx { --ctx-system: rgb(var(--c-text-dim)); --ctx-summary: rgb(var(--c-info));
             --ctx-user: rgb(var(--c-accent-2)); --ctx-tool: rgb(var(--c-accent));
             --ctx-assistant: rgb(var(--c-positive)); }
      #ctx-bar > span { min-width: 2px; transition: flex-grow .3s ease; }
      /* Past 75% of the budget, compaction is close — say so in colour rather
         than making the user read the numbers. */
      #ctx.near #ctx-bar > span { filter: saturate(.4); }
      #ctx.near #ctx-read { color: rgb(var(--c-negative)); }
      .ctx-key { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
      .ctx-key[data-k="system"] { background: var(--ctx-system); }
      .ctx-key[data-k="summary"] { background: var(--ctx-summary); }
      .ctx-key[data-k="user"] { background: var(--ctx-user); }
      .ctx-key[data-k="tool"] { background: var(--ctx-tool); }
      .ctx-key[data-k="assistant"] { background: var(--ctx-assistant); }

      :root {
        --font-display: "Space Grotesk", ui-sans-serif, system-ui;
        --font-mono: ui-monospace, Menlo, monospace;
        --media-max-h: 320px;
      }
      @media (max-width: 480px) { :root { --media-max-h: 220px; } }
      @keyframes spin { to { transform: rotate(360deg); } }
      .spin { display: inline-block; animation: spin 1s linear infinite; }
      @keyframes fadein { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
      .entry { animation: fadein 0.18s ease-out; }
      @keyframes pulse-dot { 0%,80%,100% { opacity: 0.25; } 40% { opacity: 1; } }
      .dot { animation: pulse-dot 1.2s infinite; }
      @media (prefers-reduced-motion: reduce) { .spin, .entry, .dot { animation: none; } }
      .eyebrow { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: rgb(var(--c-text-dim)); }
      /* user message — a right-aligned bubble, ChatGPT-style (no rail, no label) */
      .usermsg { background: rgb(var(--c-surface)); border-radius: 18px; padding: 0.65rem 1rem; max-width: 80%; margin-left: auto; }
      /* rendered assistant markdown */
      .md > * + * { margin-top: 0.7rem; }
      .md h1, .md h2, .md h3 { font-family: var(--font-display), sans-serif; font-weight: 600; line-height: 1.25; }
      .md h1 { font-size: 1.3rem; } .md h2 { font-size: 1.12rem; } .md h3 { font-size: 1rem; }
      .md ul, .md ol { padding-left: 1.25rem; } .md ul { list-style: disc; } .md ol { list-style: decimal; }
      .md li + li { margin-top: 0.2rem; }
      .md a { color: rgb(var(--c-accent)); text-decoration: underline; text-underline-offset: 2px; }
      .md img { max-height: var(--media-max-h); width: auto; max-width: 100%; object-fit: contain; border-radius: 10px; display: block; margin: 0.5rem 0; }
      .md code { font-family: var(--font-mono); background: rgb(var(--c-surface)); padding: 0.1em 0.35em; border-radius: 4px; font-size: 0.9em; }
      .md pre { background: rgb(var(--c-surface)); padding: 0.85rem; border-radius: 10px; overflow-x: auto; border: 1px solid rgb(var(--c-border)); position: relative; }
      .md pre code { background: none; padding: 0; }
      .md table { border-collapse: collapse; width: 100%; } .md td, .md th { border: 1px solid rgb(var(--c-border)); padding: 0.35rem 0.6rem; text-align: left; }
      .md blockquote { border-left: 2px solid rgb(var(--c-accent-2)); padding-left: 0.8rem; color: rgb(var(--c-text-dim)); }
      /* content-card frame — plain neutral surface, no colored rail */
      .frame { border: 1px solid rgb(var(--c-border)); border-radius: 12px; background: rgb(var(--c-surface)); padding: 0.75rem; }
      .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.5rem; }
      .imgwrap { position: relative; }
      .imgwrap .dl { position: absolute; top: 6px; right: 6px; opacity: 0; transition: opacity 0.15s; background: rgb(var(--c-surface) / 0.9); border: 1px solid rgb(var(--c-border)); border-radius: 8px; padding: 3px 7px; font: inherit; font-size: 11px; color: inherit; cursor: pointer; display: flex; align-items: center; gap: 4px; }
      .imgwrap .dl svg { width: 12px; height: 12px; }
      .imgwrap:hover .dl, .imgwrap .dl:focus-visible { opacity: 1; }
      .imgwrap img { cursor: zoom-in; }
      /* media sizing — one knob (--media-max-h) shared by standalone images, gallery heroes, and markdown-embedded images */
      .media-cap { max-height: var(--media-max-h); width: auto; max-width: 100%; object-fit: contain; display: block; margin: 0 auto; }
      .media-placeholder { min-height: var(--media-max-h); background: rgb(var(--c-surface)); display: flex; align-items: center; justify-content: center; border-radius: 10px; }
      table.data { border-collapse: collapse; width: 100%; font-size: 0.85rem; } table.data td, table.data th { border: 1px solid rgb(var(--c-border)); padding: 0.35rem 0.6rem; text-align: left; } table.data th { color: rgb(var(--c-accent-2)); font-family: var(--font-display); }
      .metric .v { font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; }
      /* z-index:0 makes the map its own stacking context, so Leaflet's internal
         panes (z-index 400-700) stay trapped inside it instead of competing in
         the root context — where they'd paint over #panel (z-30) and #lightbox. */
      .leaflet-container { border-radius: 10px; position: relative; z-index: 0; }
      dialog#lightbox { background: transparent; border: none; max-width: 96vw; max-height: 96vh; padding: 0; }
      dialog#lightbox::backdrop { background: rgb(0 0 0 / 0.85); }
      dialog#lightbox img, dialog#lightbox svg { max-width: 96vw; max-height: 96vh; border-radius: 8px; }
      dialog#lightbox .lb-close { position: absolute; top: -0.75rem; right: -0.75rem; width: 2rem; height: 2rem; border-radius: 999px; background: rgb(var(--c-surface)); color: rgb(var(--c-text)); border: 1px solid rgb(var(--c-border)); cursor: pointer; display: flex; align-items: center; justify-content: center; }
      /* settings */
      .settings h2 { font-family: var(--font-display); color: rgb(var(--c-text-dim)); font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; margin-top: 1.4rem; margin-bottom: 0.5rem; }
      .settings h2:first-child { margin-top: 0; }
      /* collapsible group — native <details>, so no JS and keyboard support for free */
      .settings-group { border-bottom: 1px solid rgb(var(--c-border)); padding-bottom: 0.8rem; margin-bottom: 0.8rem; }
      .settings-group:last-of-type { border-bottom: none; margin-bottom: 0; }
      .settings-group > summary { font-family: var(--font-display); font-size: 13px; font-weight: 600; cursor: pointer; padding: 0.35rem 0; margin-bottom: 0.4rem; display: flex; align-items: baseline; gap: 0.5rem; list-style: none; }
      .settings-group > summary::-webkit-details-marker { display: none; }
      .settings-group > summary::after { content: "⌄"; margin-left: auto; color: rgb(var(--c-text-dim)); line-height: 1; }
      .settings-group:not([open]) > summary::after { content: "›"; }
      .settings-group > summary:focus-visible { outline: 2px solid rgb(var(--c-accent)); outline-offset: 2px; border-radius: 6px; }
      .settings-group > summary .muted { font-weight: 400; font-size: 11px; }
      .settings-group h2:first-of-type { margin-top: 0; }
      .settings-group > p.muted:first-of-type { margin-top: 0; }
      /* grouped card section, ChatGPT-style — rows sit inside, label above */
      .settings-section { background: rgb(var(--c-surface)); border: 1px solid rgb(var(--c-border)); border-radius: 14px; padding: 0 0.9rem; margin-bottom: 0.4rem; }
      .settings .row { display: flex; align-items: center; gap: 0.5rem; justify-content: space-between; padding: 0.65rem 0; border-bottom: 1px solid rgb(var(--c-border)); }
      .settings-section .row:last-child { border-bottom: none; }
      .settings .mono { font-family: var(--font-mono); font-size: 11px; overflow-wrap: anywhere; }
      .settings .muted { color: rgb(var(--c-text-dim)); }
      .settings .inline { display: flex; gap: 0.4rem; align-items: center; }
      .settings .stack { display: flex; flex-direction: column; gap: 0.5rem; padding: 0.65rem 0; }
      .settings input, .settings textarea, .settings select { background: rgb(var(--c-bg)); border: 1px solid rgb(var(--c-border)); border-radius: 8px; padding: 0.35rem 0.55rem; font-size: 12px; outline: none; color: rgb(var(--c-text)); }
      .settings input:focus, .settings textarea:focus, .settings select:focus { border-color: rgb(var(--c-accent)); }
      /* two shared button styles: primary = solid inverse pill, ghost = outlined neutral */
      .settings .btn { background: rgb(var(--c-text)); color: rgb(var(--c-bg)); border: none; border-radius: 999px; padding: 0.35rem 0.85rem; font-size: 12px; font-weight: 500; cursor: pointer; }
      .settings .btn.ghost { background: transparent; color: rgb(var(--c-text-dim)); border: 1px solid rgb(var(--c-border)); }
      .settings .badge { font-family: var(--font-mono); font-size: 11px; color: rgb(var(--c-text-dim)); }
      .settings .badge.ok { color: rgb(var(--c-positive)); }
      /* toggle switch — a styled checkbox, no dependency */
      .switch { position: relative; display: inline-block; width: 38px; height: 22px; flex-shrink: 0; }
      .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
      .switch .track { position: absolute; inset: 0; background: rgb(var(--c-text-dim) / 0.4); border-radius: 999px; transition: background 0.15s; pointer-events: none; }
      .switch .track::before { content: ""; position: absolute; height: 16px; width: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform 0.15s; }
      .switch input:checked + .track { background: rgb(var(--c-accent)); }
      .switch input:checked + .track::before { transform: translateX(16px); }
      /* compact source-citation pills, capped with a "+N more" expander */
      .source-pill { display: inline-flex; align-items: center; gap: 0.4rem; background: rgb(var(--c-surface)); border: 1px solid rgb(var(--c-border)); border-radius: 999px; padding: 0.3rem 0.7rem 0.3rem 0.3rem; font-size: 12px; color: rgb(var(--c-text)); text-decoration: none; transition: border-color 0.15s; cursor: pointer; font: inherit; }
      .source-pill:hover { border-color: rgb(var(--c-accent)); }
      .source-pill-icon { width: 20px; height: 20px; border-radius: 999px; background: rgb(var(--c-accent) / 0.15); color: rgb(var(--c-accent)); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; }
      .source-pill-more { color: rgb(var(--c-text-dim)); background: transparent; border-style: dashed; padding: 0.3rem 0.7rem; }
      /* collapsible tool-activity summary — expanded live, collapses to one duration-stamped row when the turn completes */
      .tool-summary { border: 1px solid rgb(var(--c-border)); border-radius: 12px; overflow: hidden; }
      .tool-summary-header { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.75rem; cursor: pointer; font-family: var(--font-mono); font-size: 11px; color: rgb(var(--c-text-dim)); }
      .tool-summary-chevron { width: 14px; height: 14px; flex-shrink: 0; transition: transform 0.15s; }
      .tool-summary.collapsed .tool-summary-chevron { transform: rotate(-90deg); }
      .tool-summary-rows { padding: 0 0.75rem 0.5rem; }
      .tool-summary.collapsed .tool-summary-rows { display: none; }
      @media (prefers-reduced-motion: reduce) { .tool-summary-chevron { transition: none; } }
      /* follow-up chip keyboard-nav hint — shown only while a chip has focus */
      .followups-hint { opacity: 0; transition: opacity 0.15s; margin-bottom: 0.35rem; }
      .followups-wrap:focus-within .followups-hint { opacity: 1; }
      @media (prefers-reduced-motion: reduce) { .followups-hint { transition: none; } }
      /* accessibility: one visible focus ring for every interactive element */
      :is(button, a, input, textarea, select, [tabindex]):focus-visible { outline: 2px solid rgb(var(--c-accent)); outline-offset: 2px; border-radius: 4px; }
      /* composer: the wrapper pill carries the focus affordance, so the textarea itself shows no ring (avoids a doubled blue border) */
      #msg:focus, #msg:focus-visible { outline: none; }
      /* home / empty state: center the hero heading + composer as a group. On the
         first message #chat-area drops .home and reverts to a scrolling transcript
         with a bottom-pinned composer. */
      #chat-area:not(.home) > #log { flex: 1 1 auto; overflow-y: auto; }
      #chat-area:not(.home) #home-hero { display: none; }
      #chat-area.home { justify-content: center; }
      #chat-area.home > #log { flex: 0 0 auto; overflow: visible; padding-top: 0; padding-bottom: 0; }
      #home-hero { text-align: center; padding: 0 1.25rem 1.5rem; }
      #chat-area:not(.home) > footer { border-top: 1px solid rgb(var(--c-border)); }
      @media (max-width: 640px) {
        #log, #nokey, #composer, #status { padding-left: 0.75rem; padding-right: 0.75rem; }
      }
    </style>
    <script src="/htmx.min.js" defer></script>
    <script src="/app.js" defer></script>
    <script type="module" src="/flow.js"></script>
  </head>
  <body class="bg-base text-paper font-sans min-h-screen flex">
    <div id="app-shell" class="flex-1 flex flex-col min-w-0">
      <header class="flex items-center gap-3 px-5 h-14 border-b border-line shrink-0">
        <span class="font-display font-bold text-lg tracking-tight">adhd<span class="text-dim">.</span></span>
        <span class="eyebrow hidden sm:inline">everyday assistant</span>
        <span id="conn" class="hidden font-mono text-xs text-dim">reconnecting…</span>
        <div class="ml-auto flex items-center gap-4 font-mono text-xs text-dim">
          <button id="new-chat" class="flex items-center gap-1 text-dim hover:text-paper transition">New chat</button>
          <select id="model-select" aria-label="Model" class="bg-transparent text-paper/70 outline-none cursor-pointer hover:text-paper transition-colors"></select>
          <span><span id="tokens">0</span> tok</span>
          <button id="open-flows" class="text-dim hover:text-paper transition flex items-center gap-1">Flows</button>
          <button id="open-settings" class="text-dim hover:text-paper transition flex items-center gap-1">Settings</button>
        </div>
      </header>

      <div id="chat-area" class="flex-1 flex flex-col min-w-0 home">
        <main id="log" class="flex-1 overflow-y-auto px-5 py-8 space-y-5 max-w-3xl w-full mx-auto"></main>

        <div id="home-hero" class="max-w-3xl w-full mx-auto">
          <h1 class="font-display font-semibold text-2xl sm:text-3xl text-paper">Where should we begin?</h1>
        </div>

        <div id="nokey" class="hidden max-w-3xl w-full mx-auto px-5 pb-2">
          <div class="frame text-sm">
            Add your DeepSeek key in <button class="underline text-signal" onclick="openSettings()">Settings</button> to start.
          </div>
        </div>

        <footer class="shrink-0">
          <div id="status" class="hidden max-w-3xl w-full mx-auto px-5 pt-2 font-mono text-xs text-dim flex items-center gap-2">
            <svg class="text-dim spin" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9" stroke-dasharray="40 16"/></svg>
            <span id="status-text">thinking</span>
          </div>
          <!-- Context strip: what's actually filling the window right now. One
               segment per message, width proportional to its size, so a runaway
               tool result is visible as a fat block instead of a surprise. -->
          <div id="ctx" class="hidden max-w-3xl w-full mx-auto px-5 pt-2">
            <div id="ctx-bar" class="flex gap-px h-1.5 rounded-full overflow-hidden bg-raise" title=""></div>
            <div class="flex items-center gap-3 pt-1.5 font-mono text-[10px] text-dim">
              <span class="flex items-center gap-1"><i class="ctx-key" data-k="system"></i>system</span>
              <span class="flex items-center gap-1"><i class="ctx-key" data-k="summary"></i>summary</span>
              <span class="flex items-center gap-1"><i class="ctx-key" data-k="user"></i>you</span>
              <span class="flex items-center gap-1"><i class="ctx-key" data-k="tool"></i>tools</span>
              <span class="flex items-center gap-1"><i class="ctx-key" data-k="assistant"></i>reply</span>
              <span id="ctx-read" class="ml-auto"></span>
              <button id="ctx-compact" class="text-dim hover:text-paper transition underline decoration-dotted">Compact now</button>
            </div>
          </div>
          <form id="composer" class="max-w-3xl w-full mx-auto px-5 py-3">
            <div class="flex gap-2 items-end bg-surface border border-line rounded-3xl px-2 py-1.5 focus-within:border-dim transition-colors">
              <textarea id="msg" rows="1" placeholder="Ask adhd anything…"
                class="flex-1 resize-none bg-transparent px-2.5 py-2 text-sm outline-none max-h-40 placeholder:text-dim"></textarea>
              <button id="send" aria-label="Send" class="shrink-0 grid place-items-center w-9 h-9 rounded-full bg-paper text-base disabled:opacity-30 hover:opacity-90 transition"></button>
            </div>
          </form>
        </footer>
      </div>
    </div>

    <dialog id="lightbox"></dialog>

    <section id="panel" class="hidden fixed inset-0 bg-base overflow-y-auto z-30">
      <div class="flex items-center gap-3 px-5 h-14 border-b border-line sticky top-0 bg-base">
        <button class="text-dim hover:text-paper" onclick="closeSettings()">← Back</button>
        <span class="font-display font-bold">Settings</span>
      </div>
      <div id="settings" class="settings p-5 text-sm max-w-2xl mx-auto"></div>
    </section>

    <!-- Flows: full-screen like #panel. flow.js mounts the React Flow canvas here. -->
    <section id="flows-panel" class="hidden fixed inset-0 bg-base z-30 flex flex-col"></section>
  </body>
</html>
